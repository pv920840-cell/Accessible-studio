name: Build and Publish Accessible Studio APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure GitHub publish owner & repo in update_config.json
        run: |
          python3 -c '
          import json, os
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          for path in ("publish-config.json", "app/src/main/assets/update_config.json"):
              if os.path.exists(path):
                  with open(path, "r") as f:
                      data = json.load(f)
                  data.setdefault("build", {}).setdefault("publish", {})
                  data["build"]["publish"]["provider"] = "github"
                  data["build"]["publish"]["owner"] = owner
                  data["build"]["publish"]["repo"] = repo
                  with open(path, "w") as f:
                      json.dump(data, f, indent=2)
                      f.write("\n")
          '

      - name: Restore cached CI debug signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: accessible-studio-debug-signing-v1

      - name: Prepare debug.keystore for consistent APK signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .ci-signing
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            python3 -c 'import base64, os; open("debug.keystore", "wb").write(base64.b64decode(os.environ["DEBUG_KEYSTORE_BASE64"].strip()))'
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            python3 -c 'import base64; open("debug.keystore", "wb").write(base64.b64decode(open("debug.keystore.base64").read().strip()))'
          elif [ -f .ci-signing/debug.keystore ]; then
            echo "Restoring debug.keystore from cached CI signing key..."
            cp .ci-signing/debug.keystore debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore and caching for future CI releases..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .ci-signing/debug.keystore ] || ! cmp -s debug.keystore .ci-signing/debug.keystore; then
            cp debug.keystore .ci-signing/debug.keystore
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true
          ls -lh debug.keystore

      - name: Run unit tests and build Debug APK
        run: gradle :app:testDebugUnitTest --max-workers=1 :app:assembleDebug --stacktrace

      - name: Prepare release assets & version.json
        run: |
          python3 -c '
          import glob, json, os, re, shutil
          bc_list = glob.glob("app/build/generated/source/buildConfig/debug/**/BuildConfig.java", recursive=True) or glob.glob("app/build/generated/source/buildConfig/**/BuildConfig.java", recursive=True)
          bc = bc_list[0]
          text = open(bc).read()
          vcode = int(re.search(r"VERSION_CODE\s*=\s*(\d+)", text).group(1))
          vname = re.search(r"VERSION_NAME\s*=\s*\"([^\"]+)\"", text).group(1)
          apk_name = f"AccessibleStudio_V{vname}.apk"
          shutil.copy2("app/build/outputs/apk/debug/app-debug.apk", apk_name)
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = f"v{vname}"
          existing_notes = ""
          if os.path.exists("version.json"):
              try:
                  with open("version.json", "r") as vf:
                      vdata = json.load(vf)
                      existing_notes = (vdata.get("changelog") or vdata.get("releaseNotes") or "").strip()
              except Exception:
                  existing_notes = ""
          notes = existing_notes or f"Accessible Studio v{vname} release."
          payload = {
              "appName": "Accessible Studio",
              "versionCode": vcode,
              "versionName": vname,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk_name}",
              "pageUrl": f"https://github.com/{repo}/releases/latest",
              "apkSizeBytes": os.path.getsize(apk_name),
              "changelog": notes,
              "releaseNotes": notes
          }
          with open("version.json", "w") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          with open("RELEASE_NOTES.md", "w") as rf:
              rf.write(f"## Accessible Studio v{vname}\n\n{notes}\n")
          with open(os.environ["GITHUB_ENV"], "a") as env_f:
              env_f.write(f"VERSIONED_APK_NAME={apk_name}\n")
              env_f.write(f"RELEASE_TAG={tag}\n")
              env_f.write(f"RELEASE_VERSION={vname}\n")
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Accessible Studio v${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            ${{ env.VERSIONED_APK_NAME }}
            version.json
